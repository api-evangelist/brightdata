description: >-
  FinOps view of Bright Data spend. Bright Data bills per product on a
  usage basis: proxy networks and the Scraping Browser are metered by
  bandwidth (per GB), the Web Unlocker and SERP API are metered per 1,000
  successful requests, the Web Scraper API is metered per record, and Datasets
  are priced per record or by subscription. There is no single all-inclusive
  subscription, so cost allocation is naturally per zone / per product.
notes: >-
  Unit rates are usage-based and change frequently; the figures in the
  companion plans artifact are representative and NOT reconciled against a live
  account. Reconcile against Bright Data billing exports and the current
  pricing pages.
