meters:
- name: proxy_bandwidth
  description: Bandwidth consumed through proxy zones (residential/datacenter/ISP/mobile), billed per GB.
  unit: gigabytes
  aggregation: sum
  dimensions:
  - account
  - zone
  - proxy_type
- name: scraping_browser_bandwidth
  description: Bandwidth consumed by Scraping Browser CDP sessions, billed per GB.
  unit: gigabytes
  aggregation: sum
  dimensions:
  - account
  - zone
- name: unlocker_requests
  description: Successful Web Unlocker requests, billed per 1,000.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - zone
- name: serp_requests
  description: SERP API requests, billed per 1,000.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - zone
- name: scraper_records
  description: Records returned by the Web Scraper API, billed per record.
  unit: records
  aggregation: sum
  dimensions:
  - account
  - dataset
- name: dataset_records
  description: Records purchased from the Datasets marketplace (one-off or subscription).
  unit: records
  aggregation: sum
  dimensions:
  - account
  - dataset
principles:
- name: Visibility
  description: Pull Bright Data usage/billing exports; inspect per-zone bandwidth and per-API request burn.
- name: Allocation
  description: Create a zone per workload/team so bandwidth and request spend map cleanly to cost centers.
- name: Optimization
  description: Prefer datacenter/ISP proxies where residential is not required; cache and dedupe targets; use per-request APIs (Unlocker/SERP) instead of full browser sessions when JS rendering is unnecessary; commit to monthly tiers to lower unit rates.
- name: Accountability
  description: Assign owners per zone; review bandwidth and request spend monthly against budget.
