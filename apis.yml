aid: brightdata
url: https://raw.githubusercontent.com/api-evangelist/brightdata/refs/heads/main/apis.yml
name: Bright Data
kind: company
description: Bright Data is a web data platform providing a global proxy network
  (residential, datacenter, ISP, mobile), pre-built Web Scraper APIs for 100+ sites,
  a SERP API, the Web Unlocker, ready-made Datasets, and a Scraping Browser (Browser
  API) that exposes a real Chrome DevTools Protocol endpoint over WebSocket for
  Puppeteer, Playwright, and Selenium automation.
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
